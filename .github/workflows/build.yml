name: Build Tweak and Switch App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg
          export THEOS="${{ github.workspace }}/theos"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Compile Tweak (Deb)
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Compile Switch App (IPA)
        run: |
          cd SwitchApp
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          
          # 解包生成的 deb，提取完美的 app
          mkdir -p extracted
          dpkg-deb -x packages/*.deb extracted/
          
          mkdir -p Payload
          find extracted -name "*.app" -type d -exec cp -R {} Payload/ \;
          
          # 打包成最终 IPA
          zip -r VolumeSwitch.ipa Payload

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: VolumeDown-Deb
          path: packages/*.deb

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VolumeSwitch-IPA
          path: SwitchApp/VolumeSwitch.ipa