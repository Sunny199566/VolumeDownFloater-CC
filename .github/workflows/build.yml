name: Build Tweak and Switch App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg
          export THEOS="${{ github.workspace }}/theos"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Compile Tweak (Deb)
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Compile Switch App (IPA)
        run: |
          cd SwitchApp
          make clean
          make
          
          # 暴力手动组装 IPA 结构
          mkdir -p Payload/VolumeSwitch.app
          
          # 1. 强制把 Info.plist 放进去
          cp Info.plist Payload/VolumeSwitch.app/
          
          # 2. 找到编译好的可执行文件，拷进去
          find .theos -name "VolumeSwitch" -type f -exec cp {} Payload/VolumeSwitch.app/ \;
          
          # 3. 赋予执行权限
          chmod +x Payload/VolumeSwitch.app/VolumeSwitch
          
          # 4. 重新打包成 IPA
          zip -r VolumeSwitch.ipa Payload

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: VolumeDown-Deb
          path: packages/*.deb

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VolumeSwitch-IPA
          path: SwitchApp/VolumeSwitch.ipa